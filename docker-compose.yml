services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/anomalyiq
      - REDIS_URL=redis://redis:6379
      - PYTHON_SERVICE_URL=http://python-service:8000
      - JWT_SECRET=supersecretchangelater
      - PORT=5000
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads_data:/app/uploads

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  uploads_data: